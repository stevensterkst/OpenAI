[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-transcribe-translate"
version = "0.1.0"
description = "Windows-first local/cloud transcription, translation and bilingual summarisation"
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
