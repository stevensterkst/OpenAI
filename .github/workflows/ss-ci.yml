name: SS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q ss_brain.py
      - name: Brain route smoke test
        run: python -c "from ss_brain import APP; routes={r.path for r in APP.routes}; required={'/','/console','/workspace','/system','/api/providers','/api/models/{pid}','/api/chat','/api/auto-chat','/api/files/scan','/api/files/search','/api/files/duplicates'}; missing=required-routes; assert not missing, missing; print('SS v0.8.5 brain route smoke test OK')"
