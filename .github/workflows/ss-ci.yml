name: SS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m compileall -q ss_brain_084.py
      - name: Brain import and route smoke test
        run: python -c "from ss_brain_084 import APP, VERSION; routes={r.path for r in APP.routes}; required={'/','/console','/workspace','/system','/api/providers','/api/models/{pid}','/api/chat','/api/auto-chat','/api/files/scan','/api/files/search','/api/files/duplicates'}; missing=required-routes; assert VERSION == '0.8.4'; assert not missing, missing; print('SS v0.8.4 brain route smoke test OK')"
