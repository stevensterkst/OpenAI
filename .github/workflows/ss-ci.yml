name: SS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py ss_server.py
      - name: Route smoke test
        run: python -c "from ss_server import APP; routes={r.path for r in APP.routes}; required={'/system','/api/providers','/api/models','/api/chat','/providers','/workspace','/api/workspace/scan','/api/workspace/duplicates'}; missing=required-routes; assert not missing, missing; print('SS 0.9 workspace route smoke test OK')"
      - name: Pytest
        run: python -m pytest -q
