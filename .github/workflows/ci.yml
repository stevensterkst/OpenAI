name: SS CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m compileall -q ss_brain_084.py
      - run: python - <<'PY'
          import ss_brain_084
          assert ss_brain_084.VERSION == '0.8.4'
          assert ss_brain_084.APP is not None
          print('SS v0.8.4 runtime import/health: OK')
        PY
