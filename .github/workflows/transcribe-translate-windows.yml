name: SS Transcribe-Translate Windows build

on:
  push:
    paths:
      - "transcribe-translate/**"
      - ".github/workflows/transcribe-translate-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: transcribe-translate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Final source and build audit
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\verify-final.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SS-Transcribe-Translate-windows
          path: |
            transcribe-translate/dist/SS-Transcribe-Translate/
            transcribe-translate/FINAL-AUDIT-*.log
            transcribe-translate/SHA256.txt
          if-no-files-found: error
