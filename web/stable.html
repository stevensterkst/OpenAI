<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS Second Brain v0.8.4</title><style>body{margin:0;background:#081018;color:#eaf2f6;font:14px Segoe UI,Arial}header{height:58px;border-bottom:1px solid #294050;display:flex;align-items:center;justify-content:space-between;padding:0 18px}main{height:calc(100vh - 59px);display:grid;grid-template-columns:240px 1fr 280px}.p{padding:12px;overflow:auto;background:#0b1721;border-right:1px solid #294050}.r{border-left:1px solid #294050;border-right:0}.chat{display:flex;flex-direction:column;min-width:0}.bar{padding:9px;border-bottom:1px solid #294050;display:flex;gap:6px;flex-wrap:wrap}select,input,button,textarea{background:#08131d;color:#fff;border:1px solid #34505f;border-radius:6px;padding:8px}button{cursor:pointer}.messages{flex:1;overflow:auto;padding:18px}.msg{max-width:900px;margin:0 auto 12px;padding:12px;border-radius:9px;background:#10212d;white-space:pre-wrap}.msg.user{background:#132c36}.role{font-size:11px;color:#86a4b4;margin-bottom:5px}.composer{padding:12px;border-top:1px solid #294050}.composer textarea{width:100%;box-sizing:border-box;min-height:100px}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}.status{font:11px monospace;color:#8fa7b6;padding:6px 9px}.ok{color:#55d8ca}.bad{color:#ff8b8b}.warn{background:#261f0e;border:1px solid #5b4820;padding:9px;border-radius:7px;color:#e7d091}.small{font-size:11px;color:#8fa7b6}.chatrow{padding:9px;border:1px solid #294050;border-radius:7px;margin:5px 0;cursor:pointer}.card{border:1px solid #294050;border-radius:8px;padding:10px;margin:7px 0}.link{color:#6fddd3;text-decoration:none}@media(max-width:900px){main{grid-template-columns:190px 1fr}.r{display:none}}@media(max-width:650px){main{grid-template-columns:1fr}.p{display:none}}</style></head><body><header><b>SS SECOND BRAIN · v0.8.4</b><span><a class=link href="/system" target=_blank>system</a></span></header><main><aside class=p><b>PERMANENT CHATS</b><button style="width:100%;margin:6px 0" onclick=newChat()>＋ New chat</button><div id=chats></div><hr><b>TOOLS</b><button style="width:100%;margin:4px 0" onclick=resources()>RAM / CPU</button><button style="width:100%;margin:4px 0" onclick=location.href='/workspace'>File / legal analysis</button><div id=toolout class=small></div></aside><section class=chat><div class=bar><select id=provider onchange=providerChanged()></select><select id=model></select><label class=small><input id=cloud type=checkbox> approve cloud</label><button onclick=send()>SEND</button><button onclick=auto()>SS AUTO</button></div><div id=status class=status>Starting…</div><div id=boundary></div><div id=messages class=messages></div><div class=composer><textarea id=input placeholder="Ask SS. Chats are archived and are never automatically deleted."></textarea></div></section><aside class="p r"><b>SS CONTROL</b><div class=card><b>Stable v0.8.4</b><div class=small>Local-first. Cloud requires explicit approval.</div></div><div class=card><b>Permanent archive</b><div id=storage class=small></div></div><div class=card><b>File safety</b><div class=small>Read-only analysis. No delete, rename, move or overwrite. Any future mutation requires your explicit permission.</div></div></aside></main><script>let P={},active='',chatId=crypto.randomUUID(),messages=[];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){try{let d=await(await fetch('/api/providers')).json();P=d.providers;$('provider').innerHTML=Object.entries(P).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');await providerChanged();await loadChats();let s=await(await fetch('/api/storage')).json();$('storage').textContent=s.local+(s.cloud?' · cloud mirror '+s.cloud:'');}catch(e){$('status').textContent='SERVER ERROR: '+e;$('status').className='status bad'}}async function providerChanged(){active=$('provider').value;$('cloud').checked=false;await models()}function isFree(m,p){return p==='ollama'||p==='jan'||p==='lmstudio'||m.is_free===true}async function models(){let d=await(await fetch('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:active})})).json();if(!d.ok){$('model').innerHTML='<option>No model ready</option>';$('status').textContent='NOT READY · '+d.error;$('status').className='status bad';return}let ms=d.models.sort((a,b)=>a.id.localeCompare(b.id));$('model').innerHTML=ms.map(m=>`<option value="${esc(m.id)}">${esc(m.id)}${isFree(m,active)?' · FREE':''}</option>`).join('');$('status').textContent=`READY · ${ms.length} models · local-first`;$('status').className='status ok';$('boundary').innerHTML=''}function render(){$('messages').innerHTML=messages.map(m=>`<div class="msg ${m.role}"><div class=role>${esc(m.role)}${m.model?' · '+esc(m.model):''}</div>${esc(m.content)}</div>`).join('')||'<div class=small>New SS conversation.</div>';$('messages').scrollTop=$('messages').scrollHeight}async function send(){let t=$('input').value.trim(),m=$('model').value;if(!t||!m)return;if(P[active].kind==='cloud'&&!$('cloud').checked){$('boundary').innerHTML='<div class=warn>Cloud is blocked until you explicitly approve this turn.</div>';return}messages.push({role:'user',content:t});$('input').value='';render();let d=await(await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:active,model:m,messages,cloud_approved:$('cloud').checked,chat_id:chatId,title:t.slice(0,80)})})).json();if(!d.ok){messages.pop();render();$('boundary').innerHTML='<div class=warn>'+esc(d.error)+'</div>';return}messages.push({role:'assistant',content:d.text,model:d.model});render();$('status').textContent=`READY · ${d.provider} · ${d.model}`;$('status').className='status ok';await loadChats()}async function auto(){let t=$('input').value.trim();if(!t)return;messages.push({role:'user',content:t});$('input').value='';render();let d=await(await fetch('/api/auto-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:t,messages,chat_id:chatId})})).json();if(!d.ok){messages.pop();render();$('boundary').innerHTML='<div class=warn>'+esc(d.error)+'</div>';return}messages.push({role:'assistant',content:d.text,model:d.model});render();$('status').textContent=`AUTO → ${d.provider} · ${d.model}`;$('status').className='status ok';await loadChats()}function newChat(){chatId=crypto.randomUUID();messages=[];render();$('status').textContent='NEW CHAT · previous chats retained'}async function loadChats(){let d=await(await fetch('/api/chats')).json();$('chats').innerHTML=(d.chats||[]).map(c=>`<div class=chatrow onclick="openChat('${esc(c.id)}')"><b>${esc(c.title)}</b><div class=small>${esc(c.provider||'')} · ${c.messages||0} messages</div></div>`).join('')||'<div class=small>No archived chats.</div>'}async function openChat(id){let d=await(await fetch('/api/chats/'+encodeURIComponent(id))).json();if(!d.messages)return;chatId=d.id;messages=d.messages;render();$('status').textContent='ARCHIVED CHAT LOADED · original retained'}async function resources(){let d=await(await fetch('/api/resources')).json();$('toolout').textContent=`RAM ${d.ram_available_gb} GB free / ${d.ram_total_gb} GB · CPU ${d.cpu_percent}% · swap ${d.swap_used_gb} GB`}$('input').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')send()});boot();render()</script></body></html>
