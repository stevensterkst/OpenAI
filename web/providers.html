<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS Provider Console</title><style>body{font:14px Segoe UI,Arial;background:#071018;color:#eaf1f6;margin:0}header{padding:22px;border-bottom:1px solid #294050}main{max-width:1250px;margin:auto;padding:20px;display:grid;grid-template-columns:220px 1fr 250px;gap:15px}.card,.chat,.settings{border:1px solid #294050;border-radius:10px;padding:15px;background:#0b1824}.prov{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;background:#09131d;color:#fff;border:1px solid #294050;border-radius:7px}.prov.active{border-color:#45d2c5}.chat{min-height:600px}.bar{display:flex;gap:7px;flex-wrap:wrap}input,select,textarea,button{background:#08131d;color:#fff;border:1px solid #294050;border-radius:6px;padding:9px}textarea{width:100%;min-height:110px;margin-top:12px}.msg{padding:10px;margin:8px 0;background:#10212d;border-radius:7px;white-space:pre-wrap}.status{color:#8fa6b6;font:11px monospace;margin:8px 0}.settings label{display:block;margin:10px 0;color:#9bb0be}.settings input{width:100%;box-sizing:border-box}button{cursor:pointer}</style></head><body><header><b>SS PROVIDER CONSOLE</b> · integrated in Second Brain v0.8</header><main><section id=list></section><section class=chat><div class=bar><select id=model></select><button onclick=models()>Models</button><button onclick=test()>Test</button></div><div id=status class=status>NOT TESTED</div><div id=msgs></div><textarea id=input placeholder="Message selected AI provider…"></textarea><button onclick=send()>SEND</button></section><aside class=settings><h3>Provider</h3><label>Endpoint<input id=base></label><label>API key<input id=key type=password></label><label>Temperature<input id=temp type=number value=.7 min=0 max=2 step=.1></label><label><input id=zdr type=checkbox checked> OpenRouter ZDR</label><button onclick=save()>Save locally</button><p style="color:#8499a8">Keys are browser-only; SS does not persist them server-side.</p></aside></main><script>let P={},id='ollama',C=JSON.parse(localStorage.getItem('ss-provider')||'{}'),M={},H={};const $=x=>document.getElementById(x);async function boot(){P=(await (await fetch('/api/providers')).json()).providers;list();select(id)}function list(){$('list').innerHTML=Object.entries(P).map(([k,p])=>`<button class="prov" id=p-${k} onclick="select('${k}')"><b>${p.name}</b><br><small>${p.kind}</small></button>`).join('')}function select(k){id=k;Object.keys(P).forEach(x=>$('p-'+x).classList.toggle('active',x===k));let c=C[id]||{};$('base').value=c.base||P[id].base;$('key').value=c.key||'';$('zdr').style.display=id==='openrouter'?'block':'none';$('msgs').innerHTML='';models()}async function models(){let c=C[id]||{},key=$('key').value;if((id==='openrouter'||id==='venice')&&!key){$('status').textContent='API KEY REQUIRED';return} $('status').textContent='DISCOVERING…';try{let r=await fetch('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,base:$('base').value,apiKey:key})}),d=await r.json();if(!r.ok)throw Error(d.error);M[id]=d.models;$('model').innerHTML=d.models.map(x=>`<option value="${x.id}">${x.id}</option>`).join('');$('status').textContent='READY · '+d.models.length+' models'}catch(e){$('status').textContent='ERROR · '+e.message}}async function test(){await models()}function save(){C[id]={base:$('base').value,key:$('key').value};localStorage.setItem('ss-provider',JSON.stringify(C));models()}async function send(){let t=$('input').value.trim();if(!t)return;H[id]??=[];H[id].push({role:'user',content:t});render();$('input').value='';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,base:$('base').value,apiKey:$('key').value,model:$('model').value,messages:H[id],temperature:+$('temp').value,zdr:$('zdr').checked})}),d=await r.json();if(!r.ok)throw Error(d.error);H[id].push({role:'assistant',content:d.text});render();$('status').textContent='READY'}catch(e){$('status').textContent='ERROR · '+e.message}}function render(){$('msgs').innerHTML=(H[id]||[]).map(x=>`<div class=msg><b>${x.role}</b>\n${x.content}</div>`).join('')}boot()</script></body></html>
