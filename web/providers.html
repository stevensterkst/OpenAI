<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS Provider Console v0.8.4</title><style>body{margin:0;background:#071018;color:#eaf2f6;font:14px Segoe UI,Arial}header{padding:15px 18px;border-bottom:1px solid #294050;display:flex;justify-content:space-between}main{max-width:1500px;margin:auto;padding:15px;display:grid;grid-template-columns:250px 1fr 320px;gap:12px}.box{background:#0a1621;border:1px solid #294050;border-radius:9px;padding:12px}.prov{display:block;width:100%;text-align:left;background:#08131d;color:#fff;border:1px solid #294050;border-radius:6px;padding:9px;margin:5px 0;cursor:pointer}.prov.active{border-color:#55d8ca}.msg{background:#10212d;border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap}.messages{height:540px;overflow:auto}.status{font:11px monospace;color:#8fa7b6}.ok{color:#55d8ca}.bad{color:#ff8b8b}.warn{background:#281f0c;border:1px solid #5d4820;padding:8px;border-radius:6px;color:#e6d18c}.label{display:block;color:#9bb0be;margin:8px 0}.label input{display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#08131d;color:#fff;border:1px solid #34505f;padding:8px;border-radius:6px}input,select,button{background:#08131d;color:#fff;border:1px solid #34505f;border-radius:6px;padding:8px}button{cursor:pointer}.link{display:block;color:#6fddd3;margin:6px 0}.small{font-size:11px;color:#8fa7b6}@media(max-width:1000px){main{grid-template-columns:210px 1fr}.right{grid-column:1/3}}@media(max-width:650px){main{display:block}.box{margin-bottom:10px}}</style></head><body><header><b>SS PROVIDER CONSOLE v0.8.4</b><span><a class=link style="display:inline" href="/">← Second Brain</a></span></header><main><section class=box><b>AI PROVIDERS</b><div id=list></div><hr><b>PRIVACY / SEARCH CONNECTORS</b><div id=connectors></div></section><section class=box><div><select id=model style="min-width:300px"></select> <button onclick=models()>↻ Models</button> <button onclick=test()>Test</button></div><div id=status class=status>NOT TESTED</div><div id=boundary></div><div id=messages class=messages></div><textarea id=input style="width:100%;box-sizing:border-box;min-height:90px;background:#08131d;color:#fff;border:1px solid #34505f;border-radius:7px;padding:9px" placeholder="Direct provider test chat…"></textarea><p><label class=small><input id=cloud type=checkbox> approve cloud for this test</label><button onclick=send()>SEND</button></p></section><aside class="box right"><b>PROVIDER CONFIGURATION</b><label class=label>Endpoint<input id=base></label><label id=keylabel class=label>API key<input id=key type=password autocomplete=off></label><button onclick=save()>Save key securely + test</button> <button onclick=clearKey()>Delete key</button><div id=cred class=status></div><hr><b>OFFICIAL SETUP</b><div id=links></div><hr><b>RESOURCE GATE</b><pre id=res class=small>Loading…</pre><hr><div class=warn>SS does not invent APIs. Browser/MCP-only services are shown as real connectors instead of being presented as fake API providers.</div></aside></main><script>let P={},C={},U={},id='ollama',msgs=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){let d=await(await fetch('/api/providers')).json();P=d.providers;C=d.connectors;U=d.official_setup;$('list').innerHTML=Object.entries(P).map(([k,v])=>`<button class=prov id=p-${k} onclick="select('${k}')"><b>${esc(v.name)}</b><br><span class=small>${v.kind} · ${v.cap}</span></button>`).join('');$('connectors').innerHTML=Object.values(C).map(x=>`<a class=link target=_blank href="${x.url}">${esc(x.name)}</a><div class=small>${esc(x.status)}</div>`).join('');select('ollama');resources()}function select(k){id=k;Object.keys(P).forEach(x=>$('p-'+x)?.classList.toggle('active',x===k));$('base').value=P[k].base;$('key').value='';$('keylabel').style.display=P[k].key?'block':'none';$('cloud').checked=false;msgs=[];$('messages').innerHTML='';$('boundary').innerHTML='';$('links').innerHTML=U[k]?`<a class=link target=_blank href="${U[k]}">Open ${esc(P[k].name)} key/setup</a>`:'<span class=small>No API-key setup: local backend.</span>';cred();models()}async function models(){let p=P[id];$('status').textContent='TESTING / DISCOVERING…';try{let r=await fetch('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,base:$('base').value,apiKey:$('key').value})});let d=await r.json();if(!r.ok)throw Error(d.error);$('model').innerHTML=d.models.map(x=>`<option value="${esc(x.id)}">${esc(x.id)}${x.detail?' · '+esc(x.detail):''}</option>`).join('')||'<option>No models</option>';$('status').textContent=`READY · ${d.models.length} models · ${d.latency_ms} ms`;$('status').className='status ok';$('boundary').innerHTML=''}catch(e){$('status').textContent='NOT READY';$('status').className='status bad';$('boundary').innerHTML=`<div class=warn>${esc(e.message)}</div>`}}function test(){models()}async function save(){let k=$('key').value;if(P[id].key&&!k){$('boundary').innerHTML='<div class=warn>API key required.</div>';return}if(k){let r=await fetch('/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,apiKey:k})});let d=await r.json();if(!r.ok){$('boundary').innerHTML=`<div class=warn>${esc(d.error)}</div>`;return}}await models();cred()}async function cred(){let d=await(await fetch('/api/credentials/status')).json();$('cred').textContent=d.available?(d.configured[id]?'✓ stored in OS credential store':'No stored credential'):'OS credential store unavailable'}async function clearKey(){await fetch('/api/credentials/'+id,{method:'DELETE'});$('key').value='';cred();models()}function render(){$('messages').innerHTML=msgs.map(m=>`<div class=msg><b>${esc(m.role)}</b><br>${esc(m.content)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}async function send(){let t=$('input').value.trim();if(!t)return;if(P[id].key&&!$('cloud').checked){$('boundary').innerHTML='<div class=warn>Approve cloud for this test first.</div>';return}let m=$('model').value;msgs.push({role:'user',content:t});render();try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,model:m,messages:msgs,apiKey:$('key').value,cloud_approved:$('cloud').checked,zdr:id==='openrouter'})});let d=await r.json();if(!r.ok)throw Error(d.error);msgs.push({role:'assistant',content:d.text});render();$('status').textContent=`READY · ${d.model} · ${d.latency_ms} ms`;$('status').className='status ok'}catch(e){msgs.pop();render();$('boundary').innerHTML=`<div class=warn>${esc(e.message)}</div>`}}async function resources(){let d=await(await fetch('/api/resources')).json();$('res').textContent=d.ok?`RAM free ${d.ram_available_gb}/${d.ram_total_gb} GB\nRAM used ${d.ram_used_percent}%\nCPU ${d.cpu_percent}%\nSwap ${d.swap_used_gb} GB`:'Unavailable'}boot()</script></body></html>
